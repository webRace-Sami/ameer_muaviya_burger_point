<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="topBun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bottomBun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="patty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a2a18"/>
      <stop offset="100%" stop-color="#381a10"/>
    </linearGradient>
    <linearGradient id="cheese" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Circular Glow Background -->
  <circle cx="50" cy="50" r="48" fill="#090d16" stroke="#f59e0b" stroke-width="3"/>

  <!-- Top Bun -->
  <path d="M 18 42 C 18 20, 82 20, 82 42 Z" fill="url(#topBun)"/>
  
  <!-- Sesame Seeds -->
  <circle cx="35" cy="28" r="1.8" fill="#fff" opacity="0.9"/>
  <circle cx="50" cy="24" r="1.8" fill="#fff" opacity="0.9"/>
  <circle cx="65" cy="28" r="1.8" fill="#fff" opacity="0.9"/>
  <circle cx="42" cy="34" r="1.8" fill="#fff" opacity="0.9"/>
  <circle cx="58" cy="34" r="1.8" fill="#fff" opacity="0.9"/>

  <!-- Lettuce Leaf (Wavy Fresh Green) -->
  <path d="M 14 45 Q 22 40, 30 45 Q 38 50, 46 44 Q 54 39, 62 45 Q 70 51, 78 45 Q 84 41, 86 46 Q 84 49, 78 48 Q 70 53, 62 47 Q 54 41, 46 46 Q 38 52, 30 47 Q 22 42, 14 47 Z" fill="#22c55e"/>

  <!-- Tomato Slices -->
  <rect x="20" y="47" width="28" height="6" rx="3" fill="#ef4444"/>
  <rect x="52" y="47" width="28" height="6" rx="3" fill="#ef4444"/>

  <!-- Melted Cheese -->
  <polygon points="18,52 82,52 74,62 55,57 45,64 30,56 22,61" fill="url(#cheese)"/>

  <!-- Juicy Patty -->
  <rect x="16" y="55" width="68" height="13" rx="6.5" fill="url(#patty)"/>

  <!-- Bottom Bun -->
  <path d="M 20 68 C 20 68, 20 80, 50 80 C 80 80, 80 68, 80 68 Z" fill="url(#bottomBun)"/>
</svg>
